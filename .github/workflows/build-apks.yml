name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: find
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$G" ]; then
            echo "gradlew NOT FOUND. Files in repo:"
            find . -not -path './.git/*' -maxdepth 3 | head -60
            exit 1
          fi
          echo "dir=$(dirname "$G")" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build player and admin APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: player-app
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: admin-app
          path: ${{ steps.find.outputs.dir }}/admin/build/outputs/apk/debug/*.apk
